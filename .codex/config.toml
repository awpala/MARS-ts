# Codex project configuration for MARS-ts.
#
# Canonical repository instructions live in /AGENTS.md, which Codex reads
# natively; it routes to task-specific guidance under /docs/agents/. Shared
# skills live in /.agents/skills/ and are discovered automatically; role
# adapters live in /.codex/agents/ and load /.agents/agents/. This file holds
# only Codex-specific configuration.

# Codex may edit files in the workspace, but not outside it. The legacy Java
# tree is read-only by repository policy (AGENTS.md); Codex has no path-level
# write deny, so that rule is enforced by instruction and review here, and by
# Edit deny rules in .claude/settings.json for Claude Code.
sandbox_mode = "workspace-write"

# Pause for approval before operations that may escape the sandbox.
approval_policy = "on-request"

[sandbox_workspace_write]
# Development servers and first-party documentation use the network.
network_access = true

# --- MCP servers -----------------------------------------------------------
#
# Direct first-party: official Svelte/SvelteKit documentation, static analysis,
# and the Svelte autofixer. Svelte's hosted endpoint until the app is
# scaffolded (P1); then switch to the lockfile-pinned local server:
#   command = "/workspace/node_modules/.bin/svelte-mcp"
# and make the same change in /.mcp.json (docs/agents/tooling.md).
[mcp_servers.svelte]
url = "https://mcp.svelte.dev/mcp"
