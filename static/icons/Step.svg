<!-- Original theme-aware Step glyph. ToolbarIcon references #icon, so the page theme's variables and current text color apply; the fallbacks render the light theme standalone. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22">
  <g
    id="icon"
    fill="none"
    stroke="currentColor"
    stroke-width="1.7"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M12 3v12m-5-5 5 5 5-5M5 20h14" stroke="var(--theme-icon-blue, #236ba5)" />
  </g>
</svg>
