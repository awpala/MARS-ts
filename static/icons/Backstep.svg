  <g
    id="icon"
    fill="none"
    stroke="currentColor"
    stroke-width="1.7"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M10 4 5 9l5 5M5 9h9a5 5 0 0 1 0 10h-3" stroke="var(--theme-icon-blue, #236ba5)" />
  </g>
</svg>
