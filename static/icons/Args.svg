  <g
    id="icon"
    fill="none"
    stroke="currentColor"
    stroke-width="1.7"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M6 4H3v16h3m12-16h3v16h-3" stroke="var(--theme-icon-blue, #236ba5)" />
    <path d="M8 16l4-8 4 8m-6.5-3h5" />
  </g>
</svg>
