<!-- Original theme-aware hexadecimal-address glyph. ToolbarIcon references #icon, so the page theme's variables and current text color apply; the fallbacks render the light theme standalone. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22">
  <g
    id="icon"
    fill="none"
    stroke="currentColor"
    stroke-width="1.7"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M9 9a4 4 0 1 0-8 0c0 3 4 6 4 6s4-3 4-6Z" />
    <circle cx="5" cy="8" r="1" />
    <text
      x="10"
      y="18"
      fill="currentColor"
      stroke="none"
      font-family="monospace"
      font-size="11"
      font-weight="bold"
    >0x</text>
  </g>
</svg>
