<!-- Original theme-aware Close All glyph. ToolbarIcon references #icon, so the page theme's variables and current text color apply; the fallbacks render the light theme standalone. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22">
  <g
    id="icon"
    fill="none"
    stroke="currentColor"
    stroke-width="1.7"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M2 4v18h15" />
    <path d="M6 2h10l5 5v12H6ZM16 2v5h5" stroke="var(--theme-icon-blue, #236ba5)" />
    <path d="m10 10 7 7m0-7-7 7" stroke="var(--theme-icon-red, #bc4141)" />
  </g>
</svg>
