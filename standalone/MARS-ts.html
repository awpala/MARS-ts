<header>
  <h3>MARS — MIPS Assembler and Runtime Simulator</h3>
  <p>Original article: Release 4.5 · August 2014</p>
  <h4>Introduction</h4>
</header>
<p>
  MARS assembles and simulates MIPS assembly language programs. MARS-ts brings its assembler,
  simulator, and interactive desktop to the browser using TypeScript and Svelte. You do not need
  Java or an executable JAR to use this application. The TypeScript port targets MARS-ts 1.0; the
  original article’s release and date above identify its source.
</p>
<p>
  The current instruction registry contains 155 basic registrations and 388 pseudo-instruction
  definitions. Load and store instructions support seven address forms: <code>label</code>,
  <code>immed</code>, <code>label+immed</code>, <code>($reg)</code>, <code>label($reg)</code>,
  <code>immed($reg)</code>, and <code>label+immed($reg)</code>, where <code>immed</code> can be a
  32-bit integer. Settings → Permit extended (pseudo) instructions and formats controls whether
  extended forms are accepted.
</p>
<p>
  The original authors’ guiding reference was
  <cite>Computer Organization and Design, Fourth Edition</cite>, Patterson and Hennessy, Elsevier –
  Morgan Kaufmann, 2009: Figures 3.24 and 3.25, pages 279–281, and Appendix B. The legacy
  implementation excluded the delay branches from the left column of Figure 3.25. The browser port
  derives its instruction definitions from that implementation.
</p>
<h3>Working in the browser</h3>
<p>
  New creates an editor source. Open selects sources saved in this browser; Save commits the current
  text to that local library. Auto Save commits edits automatically when enabled. Open tabs and
  in-progress edits are recovered after reload when browser storage is available. Import File(s)
  (Ctrl+I) reads .asm or .s files, or ZIP archives of them, from your computer and shows a summary
  to confirm, and Export File downloads copies. Browser storage can be cleared, so export sources
  you need to keep. Export MARS downloads everything MARS stores in this browser (saved sources,
  open files with unsaved edits, settings, and the session with its loaded program) as one
  mars-ts-data.json file. Import MARS reads such a file, shows what it contains, and after you
  confirm replaces all MARS data in this browser with it and restarts MARS; a file that is not valid
  MARS data is listed with its problems and changes nothing. Both are unavailable while a program
  runs.
</p>
<p>
  Cut, Copy, and Paste use Ctrl+X, Ctrl+C, and Ctrl+V (Command on macOS). Undo (Ctrl+Z) restores the
  selection before an edit. Redo (Ctrl+Y or Ctrl+Shift+Z) restores the caret or selection after it.
</p>
<p>
  Enter copies the current line’s leading spaces and tabs. Insert toggles overwrite for the current
  source. Press <kbd>Ctrl+\\</kbd> or choose Edit → Rectangular selection. The lower-right status bar
  shows “Rectangular selection (Ctrl+\\)” while the mode is active. Hold Shift and use the arrow keys
  to select the width and height of the rectangle. Copy and Cut take those columns from each row.
  Paste replaces them line by line.
</p>
<p>
  To repeat an editor action, press <kbd>Ctrl+Enter</kbd> and release both keys. The lower-right
  status bar shows “Repeat ×1 (Ctrl+Enter)”. Type a count to update it, then press the character or
  editing key to repeat. Escape cancels a pending repeat.
</p>
<p>
  Assemble translates the current source, including unsaved edits. The toolbar button appears in
  Edit, and a successful assembly opens Execute. Run → Assemble and F3 work from either view. To
  assemble additional source, use explicit <code>.include</code> directives in the active program.
  Included sources resolve from open buffers first and saved library sources second.
</p>
<p>
  When manual assembly fails, Mars Messages selects the first error with a source location and the
  editor selects its line. Warnings also qualify when treated as errors. Assemble on open selects
  the message and leaves the editor caret in place. Click a diagnostic to open its source and select
  the line.
</p>
<p>
  The Execute pane supports Go, Step, Backstep, Pause, Stop, Reset, breakpoints, labels, and
  inspection and editing of registers and memory while execution is stopped. Execute adds the Run
  I/O tab, Clear All button, and register sidebar. The Register Banks switch in the menu bar
  remembers if you hide the sidebar. Edit shows Mars Messages and editing tools, including line
  numbers and current-line highlighting. Both views offer File actions and the Settings menu. The
  Execute display toolbar controls labels, program arguments, number formats, ASCII data, and popup
  input. Enable Args to enter program arguments below the Text Segment heading. The first Go or Step
  after assembly or Reset supplies them through
  <code>$a0</code> (argc) and <code>$a1</code> (argv).
</p>
<p>
  Console reads and writes, heap allocation, exit, and integer formatting syscalls are available.
  Random services 40–44, dialog services 50–59, and MIDI services 31 and 33 (as sine tones) are
  available, along with automatic exception-handler selection. File, time, and sleep syscall
  families and Tools remain unfinished; see Syscalls for the service-by-service reference. Memory
  Configuration is available in Settings. This browser application has no command-line launcher.
</p>
<h3>Dump memory to a file</h3>
<p>
  After assembly, choose File → Dump Memory (Ctrl+D) or its toolbar button while execution is
  stopped. Select the populated <code>.text</code> or <code>.data</code> range and ASCII Text,
  Binary, Binary Text, Hexadecimal Text, Intel hex format, or Text/Data Segment Window. Dump To File
  opens the browser/OS Save As dialog where supported; other browsers use a download with the
  browser's configured destination. Canceling the picker keeps your choices. A save failure stays
  visible so you can retry. Dumps use current memory, including changes from execution, and do not
  save or modify your source files. Segment Window follows hexadecimal/decimal display settings.
  Binary suggests <code>.bin</code>, hexadecimal formats <code>.hex</code>, and other text formats
  <code>.txt</code>. MIF is not an enabled legacy format.
</p>
<h3>Original authors and project history</h3>
<p>
  The original “Questions and Comments” section credited Dr. Pete Sanderson
  (<code>PSanderson@otterbein.edu</code>) and Dr. Ken Vollmar
  (<code>KenVollmar@missouristate.edu</code>). These are historical Java MARS contacts, not a
  support commitment for the TypeScript port. The authors presented MARS papers at the 2005 CCSC:MW
  conference and the 2006 SIGCSE Technical Symposium, and a tutorial at the 2007 CCSC:CP conference.
</p>

<header>
  <h3>Interactive Debugging Features</h3>
  <p>Original article: Release 4.5 · August 2014</p>
</header>
<p>
  Assemble a program to populate the Execute pane. Its Text Segment shows addresses, machine code,
  basic instructions, and source. The highlighted instruction tracks execution, and register and
  memory highlights show writes.
</p>
<ul>
  <li>
    <strong>Step (F7)</strong> executes one machine instruction and updates the display. A
    pseudo-instruction may expand into several machine instructions.
  </li>
  <li>
    <strong>Go (F5)</strong> runs continuously or resumes from a step, pause, or breakpoint. The Run
    Speed slider ranges from 0.05 instructions per second (20 seconds between steps) to 30
    instructions per second, then unlimited. The browser yields periodically during unlimited
    execution so controls can respond; its timing is not a hardware clock.
  </li>
  <li>
    <strong>Breakpoints</strong> use the checkboxes beside instructions in the Text Segment. The
    toolbar’s Toggle all breakpoints (Alt/Option+T) suspends and restores the selected addresses
    without losing them; Clear all breakpoints (Ctrl+K) removes them. Command is accepted in place
    of Ctrl on macOS when the browser delivers the shortcut to the page. Breakpoint suspension was
    introduced in Java Release 3.8. Unlike the original, which read breakpoints only when Go
    started, MARS-ts lets you set, clear, suspend, or restore breakpoints while Go is running at a
    finite speed; the change applies from the next instruction, so checking a breakpoint ahead of
    the current instruction pauses there. A pending Step is unaffected. At unlimited speed (the
    default) the program simply runs, without step-by-step display, so breakpoint controls are
    locked, even while execution is stopped; the breakpoints already set still apply. Lower the run
    speed to set or change breakpoints, even while the program runs.
  </li>
  <li>
    <strong>Pause (F9)</strong> requests a pause; <strong>Stop (F11)</strong> requests termination.
    Pending console input is released when execution is interrupted. Empty or invalid numeric input
    can still produce an input error.
  </li>
  <li>
    <strong>Backstep (F8)</strong> undoes recorded memory, register, and condition-flag changes one
    instruction at a time. History holds up to 2000 recent steps. It does not undo console output or
    other external I/O, and is separate from source-editor Undo. It is available after stepping,
    pausing, or termination when history remains. The browser has no properties-file control for its
    capacity.
  </li>
  <li>
    <strong>Reset (F12)</strong> restores post-assembly memory and registers by reassembling the
    retained program. Editing source requires a fresh Assemble before execution.
  </li>
</ul>
<p>
  Backstep and Reset bring Run I/O to the front. Click an instruction’s Source cell to focus its
  line in an open file, including a file referenced by .include. The Basic column follows the
  address and value base settings immediately.
</p>
<h3>Inspecting memory and registers</h3>
<p>
  Toolbar toggles select hexadecimal or decimal addresses and values. Data memory also has an ASCII
  view. Memory is little-endian: a displayed hexadecimal word places its most significant byte on
  the left, so four string bytes can appear reversed relative to their order in memory.
</p>
<p>
  The Data Segment shows 512 bytes (16 rows) at a time, initially at <code>0x10010000</code>.
  Navigation and range controls move through memory or select the stack pointer, global pointer,
  heap (<code>0x10040000</code>), extern globals (<code>0x10000000</code>), kernel data
  (<code>0x90000000</code>), MMIO (<code>0xFFFF0000</code>), or raw text. Raw text inspection was
  added in Java MARS 4.4. An MMIO region does not imply that device Tools are available.
</p>
<p>
  You can select a range and page through memory during Go. Hold either arrow to page repeatedly.
  The stack and global pointer choices start on a 32-byte row and keep the whole page within user
  memory. Switching to Edit and back preserves the last highlighted store. Press Escape to cancel an
  unfinished numeric cell edit.
</p>
<p>
  While execution is stopped, edit a permitted register or memory input and commit with Enter or by
  leaving the field. Integers accept decimal or hexadecimal with a leading <code>0x</code>,
  including negative values in signed or two’s-complement form. Invalid input does not change the
  machine value. The zero register, program counter, and return address are not editable in the
  general-register table. ASCII memory cells are read-only.
</p>
<p>
  Settings → Self-modifying code (off by default, introduced in Java Release 4.4) permits writes to
  user text and execution from user data. While stopped, text words can be edited in the Data
  Segment or the Text Segment Code column when this setting is enabled.
</p>
<p>
  Floating registers accept decimal values, including E notation such as <code>12.5e3</code>, or
  hexadecimal IEEE-754 bit patterns. A double overlays two single registers; changing either
  representation changes the corresponding paired view.
</p>
<p>
  The Labels window, shown by default and toggled by Show Labels Window (symbol table) in Settings
  or the Execute toolbar, lists symbols. Filter Data or Text symbols, sort using the Label or
  Address headings, and select a label to navigate to its memory or instruction address.
</p>
<p class="notice">
  Unlike the original Swing article’s live-editing workflow, MARS-ts disables machine edits during
  execution. Pause or Step before changing registers or memory. Condition flags remain editable
  while the program runs, and so do breakpoints at any speed below unlimited.
</p>

<ul>

  </li>
  <li>

  </li>
  <li>

<h3>Assembly and execution</h3>
<p>
  The Settings menu has separators after Prompt to clear all breakpoints and Self-modifying code.
  Assembly uses the active source and its explicit <code>.include</code> directives; there is no
  assemble-all control. A previously saved assemble-all preference is reset when the desktop starts.
  Included source resolves from current open buffers first, then saved library files.
</p>
<ol>
  <li>
    <strong>Assemble file on open:</strong> off by default. Automatically assembles a source when
    opened.
  </li>
  <li>
    <strong>Assembler warnings are considered errors:</strong> off by default; introduced in Java
    Release 3.5. When enabled, any assembly warning makes assembly fail. Unrecognized or ignored
    directives can produce warnings, as can truncated numeric data.
  </li>
  <li>
    <strong>Initialize Program Counter to global main if defined:</strong> off by default;
    introduced in Java Release 3.8. Uses the address of the text label <code>main</code> declared
    with <code>.globl main</code>, if present. Otherwise execution starts at the default text
    address.
  </li>
  <li>
    <strong>Clear all outputs on Go:</strong> off by default; added by MARS-ts. When enabled, Go
    clears both Mars Messages and Run I/O before it starts a fresh run after Assemble or Reset.
    Resuming after Pause, a breakpoint, Step, or Backstep keeps existing output, and Step, Assemble,
    Reset, and Backstep never clear it.
  </li>
  <li>
    <strong>Prompt to clear all breakpoints:</strong> off by default; added by MARS-ts. Clear all
    breakpoints normally removes them at once, as in Java MARS. When enabled, the toolbar button,
    Run menu entry, and Ctrl+K first ask for confirmation, and Cancel keeps every breakpoint.
    Clearing Keep showing this warning in that confirmation turns this setting off.
  </li>
  <li>
    <strong>Permit extended (pseudo) instructions and formats:</strong> on by default. Includes
    address forms beyond the native 16-bit offset plus register.
  </li>
  <li>
    <strong>Delayed branching:</strong> off by default. The instruction after a branch or jump
    executes before the transfer. Account for the delay slot, often with an explicit
    <code>nop</code>; the assembler does not automatically add one after every source branch.
    Introduced in Java Release 3.3. Since Release 3.4, branch offsets are encoded relative to the
    next instruction regardless of this setting, with simulation adjusted accordingly. Changing this
    option automatically reassembles a loaded program.
  </li>
  <li>
    <strong>Self-modifying code:</strong> off by default; introduced in Java Release 4.4. Permits
    program writes to user text, execution from user data, and stopped-state editing of text words.
  </li>
</ol>
<h3>Program arguments</h3>
<p>
  Program arguments provided to MIPS program is off by default. Its Args toolbar toggle sits
  immediately to the right of Labels and shares the Settings selection. When enabled, a Program
  Arguments field appears below the Text Segment heading, above the instruction table. The setting
  and argument text are saved in this browser. The X button beside the field clears the entry
  without turning Args off or changing arguments already applied to the program.
</p>
<p>
  Enter arguments separated by spaces or tabs. For example, <code>first second</code> supplies two
  arguments. Quotes and backslashes are literal characters, not shell syntax:
  <code>"two words"</code> supplies two arguments with quote characters included. Newline, carriage
  return, and form feed are also delimiters in the engine's text parser. No executable filename is
  added. Non-ASCII text follows the original MARS low-byte character storage, not UTF-8 encoding.
</p>
<p>
  Before the first Go or Step after Assemble or Reset, MARS places null-terminated strings and their
  pointers on the stack, sets <code>$a0</code> to the argument count (argc), sets
  <code>$a1</code> to the pointer array (argv), and adjusts <code>$sp</code>. A null pointer ends
  argv. Empty or whitespace-only input leaves these registers unchanged. Initialization occurs only
  when the setting is enabled. Editing the field or toggling it after execution starts affects the
  next Assemble/Reset run; it does not change the current program's arguments. Backstep does not
  undo initialization. Reload recovers the applied machine arguments and retains the current field
  text separately. This feature does not provide a command-line launcher.
</p>
<h3>Memory Configuration</h3>
<p>
  Choose Default (the SPIM-derived layout), Compact, Data at Address 0, or Compact, Text at Address
  0. Selecting a configuration previews its segment addresses without changing the machine. Apply
  commits the selection and leaves the dialog open; Apply and Close also closes it. Cancel closes
  without applying the current selection. Reset restores the selection from when the dialog opened
  without applying it. Applying a different layout resets memory and registers and automatically
  reassembles a loaded program. Delayed-branching and layout changes rebuild the loaded source even
  after switching or closing editor tabs. The selected layout persists in localStorage.
</p>
<h3>Exception Handler</h3>
<p>
  Settings → Exception Handler ... opens the automatic handler dialog. Enable exception handler is
  off by default. Browse selects one saved source from this browser’s library and displays its
  filename beside the button. Browse and the filename appear only for the custom choice. While
  inclusion is off, both radio choices are disabled and dimmed, and Browse is disabled; the selected
  source is retained. Save or import a handler before selecting it; never-saved buffers are not
  listed. When the handler is open, assembly uses its current text, including unsaved edits. The
  enabled handler is assembled first.
</p>
<p>
  The switch enables or disables inclusion of the selected file without clearing the selection. OK
  saves both the enabled flag and filename, even when disabled; both are restored after reopening or
  reloading the app. Cancel, Escape, or closing the dialog discards changes. An enabled empty
  selection adds nothing, and missing sources fail only when assembling. The dialog remains
  available during execution; changes apply to future assemblies without changing loaded code or
  Reset.
</p>
<p>
  Use SPIM default exceptions handler selects the bundled handler and startup code instead of a
  custom library source. It requires a global <code>main</code> label and the default memory layout;
  its unsupported directives produce assembler warnings. Open default
  <code><strong>exceptions.s</strong></code> in editor closes without applying changes and displays
  a locked read-only reference. Copy to new file makes an editable copy with its license intact. The
  reference remains protected after reload and is excluded from library saves and Export All Files.
  Exceptions ends the runtime/debug toolbar group; Memory Configuration follows ASCII in the display
  group. These buttons open the same dialogs as Settings.
</p>
<h3>Legacy settings without a current browser control</h3>
<ul>
  <li>
    <strong>Editor dialog</strong> (Java Release 3.3) and <strong>Highlighting dialog</strong> (Java
    Release 3.6): the port uses bundled editor/highlighting presets instead of font and color
    dialogs. Toolbar display settings and the appearance switch remain available.
  </li>
</ul>
<p>
  Source saving has separate controls: File → Auto Save commits edits to the local source library.
  Recovery backups retain open-buffer text independently of manual Save. Stable machine state and
  backstep history are recovered after reload; active execution and pending input are not resumed.
</p>

</p>

<header>
  <h3>SYSCALL functions available in MARS</h3>
</header>

<h3>Introduction</h3>
<p>
  A number of system services, mainly for input and output, are available for use by your MIPS
  program. They are described in the table below.
</p>
<p>
  MIPS register contents are not affected by a system call, except for result registers as specified
  in the table below.
</p>
<h3>How to use SYSCALL system services</h3>
Step 1. Load the service number in register $v0.<br />
Step 2. Load argument values, if any, in $a0, $a1, $a2, or $f12 as specified.<br />
Step 3. Issue the SYSCALL instruction.<br />
Step 4. Retrieve return values, if any, from result registers as specified.<br />

<strong>Example: display the value stored in $t0 on the console</strong><br />
<pre>
    li  $v0, 1           # service 1 is print integer
    add $a0, $t0, $zero  # load desired value into argument register $a0, using pseudo-op
    syscall
</pre>

<h3>Notes</h3>
<p>Services numbered 30 and higher are not provided by SPIM.</p>
<ul aria-label="Syscall notes">
  <li>
    <b>Service 8</b> - Follows semantics of UNIX 'fgets'. For specified length n, string can be no
    longer than n-1. If less than that, adds newline to end. In either case, then pads with null
    byte If n = 1, input is ignored and null byte placed at buffer address. If n &lt; 1, input is
    ignored and nothing is written to the buffer.
  </li>
  <li><b>Service 11</b> - Prints ASCII character corresponding to contents of low-order byte.</li>
  <li>
    <b>Service 13 (legacy reference)</b> - MARS implements three flag values: 0 for read-only, 1 for
    write-only with create, and 9 for write-only with create and append. It ignores mode. The
    returned file descriptor will be negative if the operation failed. The underlying file I/O
    implementation uses <code>java.io.FileInputStream.read()</code> to read and
    <code>java.io.FileOutputStream.write()</code> to write. MARS maintains file descriptors
    internally and allocates them starting with 3. File descriptors 0, 1 and 2 are always open for:
    reading from standard input, writing to standard output, and writing to standard error,
    respectively (new in release 4.3).
  </li>
  <li>
    <b>Services 13,14,15</b> - In MARS 3.7, the result register was changed to $v0 for SPIM
    compatability. It was previously $a0 as erroneously printed in Appendix B of
    <i>Computer Organization and Design,</i>.
  </li>
  <li>
    <b>Service 17</b> - If the MIPS program is run under control of the MARS graphical interface
    (GUI), the exit code in $a0 is ignored.
  </li>
  <li>
    <b>Service 30 (legacy reference)</b> - System time comes from
    <code>java.util.Date.getTime()</code> as milliseconds since 1 January 1970.
  </li>
  <li><b>Services 31,33</b> - Simulate MIDI output through sound card. Details below.</li>
  <li>
    <b>Services 40-44</b>
    reproduce the pseudorandom generator algorithm specified by
    <code>java.util.Random</code>. Each stream (identified by $a0 contents) is modeled by a
    different <code>Random</code> object. There are no default seed values, so use the Set Seed
    service (40) if replicated random sequences are desired.
  </li>
</ul>

<hr />
<h3>Legacy example of File I/O (not yet available)</h3>
The sample MIPS program below will open a new file for writing, write text to it from a memory
buffer, then close it. The file will be created in the directory in which MARS was run.
<pre>
# Sample MIPS program that writes to a new file.
#   by Kenneth Vollmar and Pete Sanderson

        .data
fout:   .asciiz "testout.txt"      # filename for output
buffer: .asciiz "The quick brown fox jumps over the lazy dog."
        .text
  ###############################################################
  # Open (for writing) a file that does not exist
  li   $v0, 13       # system call for open file
  la   $a0, fout     # output file name
  li   $a1, 1        # Open for writing (flags are 0: read, 1: write)
  li   $a2, 0        # mode is ignored
  syscall            # open a file (file descriptor returned in $v0)
  move $s6, $v0      # save the file descriptor
  ###############################################################
  # Write to file just opened
  li   $v0, 15       # system call for write to file
  move $a0, $s6      # file descriptor
  la   $a1, buffer   # address of buffer from which to write
  li   $a2, 44       # hardcoded buffer length
  syscall            # write to file
  ###############################################################
  # Close the file
  li   $v0, 16       # system call for close file
  move $a0, $s6      # file descriptor to close
  syscall            # close file
  ###############################################################
</pre>

<hr />

<h3>Using SYSCALL system services 31 and 33: MIDI output</h3>
<p>
  <strong>MARS-ts:</strong> the browser's Web Audio API plays a sine tone in place of the
  <code>javax.sound.midi</code> synthesizer described below. The instrument number is accepted, and
  out-of-range values still take their defaults, but every instrument sounds the same.
</p>
These system services are unique to MARS, and provide a means of producing sound. MIDI output is
simulated by your system sound card, and the simulation is provided by the
<code>javax.sound.midi</code>
package.
<p>
  Service 31 will generate the tone then immediately return. Service 33 will generate the tone then
  sleep for the tone's duration before returning. Thus it essentially combines services 31 and 32.
</p>
<p>This service requires four parameters as follows:</p>

          <li>Each number is one semitone / half-step in the chromatic scale.</li>
          <li>
            0 represents a very low C and 127 represents a very high G (a standard 88 key piano
            begins at 9-A and ends at 108-C).
          </li>
          <li>
            If the parameter value is outside this range, it applies a default value 60 which is the
            same as middle C on a piano.
          </li>
          <li>From middle C, all other pitches in the octave are as follows:</li>
        </ul>

<header>
  <h3>Writing and Using MIPS exception handlers in MARS</h3>
</header>

<h3>Introduction</h3>
<i>Exception handlers</i>, also known as <i>trap handlers</i> or <i>interrupt handlers</i>, can
easily be incorporated into a MIPS program. This guide is not intended to be comprehensive but
provides the essential information for writing and using exception handlers.

<p>
  Although the same mechanism services all three, <i>exceptions</i>, <i>traps</i> and
  <i>interrupts</i> are all distinct from each other. Exceptions are caused by exceptional
  conditions that occur at runtime such as invalid memory address references. Traps are caused by
  instructions constructed especially for this purpose, listed below. Interrupts are caused by
  external devices.
</p>
<p>MARS partially but not completely implements the exception and interrupt mechanism of SPIM.</p>
<h3>Essential Facts</h3>
Some essential facts about writing and using exception handlers include:
<ul>
  <li>MARS simulates basic elements of the MIPS32 exception mechanism.</li>
  <li>
    The MIPS instruction set includes a number of instructions that conditionally trigger a trap
    exception based on the relative values of two registers or of a constant and a register:
    <code>teq</code>, <code>teqi</code> (trap if equal), <code>tne</code>, <code>tnei</code> (trap
    if not equal), <code>tge</code>, <code>tgeu</code>, <code>tgei</code>, <code>tgeiu</code> (trap
    if greater than or equal), <code>tlt</code>, <code>tltu</code>, <code>tlti</code>,
    <code>tltiu</code> (trap if less than)
  </li>
  <li>
    When an exception occurs,
    <ol>
      <li>Coprocessor 0 register $12 (status) bit 1 is set</li>
      <li>
        Coprocessor 0 register $13 (cause) bits 2-6 are set to the exception type (codes below)
      </li>
      <li>
        Coprocessor 0 register $14 (epc) is set to the address of the instruction that triggered the
        exception
      </li>
      <li>
        If the exception was caused by an invalid memory address, Coprocessor 0 register $8 (vaddr)
        is set to the invalid address.
      </li>
      <li>
        Execution flow jumps to the MIPS instruction at memory location <code>0x80000180</code>.
        This address in the kernel text segment (<code>.ktext</code> directive) is the standard
        MIPS32 exception handler location. Settings → Memory Configuration selects the layout; both
        compact configurations use <code>0x00004180</code> as the exception handler address.
      </li>
    </ol>
  </li>
  <li>
    Include a handler in the same source as the program (as below), use <code>.include</code>, or
    choose Settings → Exception Handler ... to add a handler automatically to every assembly. Use
    Enable exception handler, select Use a custom exception handler, then Browse to choose a saved
    browser-library source and press OK. Browse and its filename appear only for the custom choice.
    Turning inclusion off disables and grays out both radio choices and disables Browse, retaining
    the selected source. Automatic inclusion defaults to off. The handler is assembled before the
    program, using its current open-buffer text when available. Opening a handler in another tab
    alone does not include it. Cancel or Escape discards dialog changes; turning inclusion off
    retains the chosen file. OK saves the selected filename and enabled state independently,
    including a file chosen before disabling, and both survive app reload. Changes affect future
    assemblies, including when made during execution. A missing source is reported at assembly time.
  </li>
  <li>
    If there is no instruction at the configured exception handler address, MARS will terminate the
    MIPS program with an appropriate error message.
  </li>
  <li>
    The exception handler can return control to the program using the <code>eret</code> instruction.
    This will place the EPC register $14 value into the Program Counter, so be sure to increment $14
    by 4 before returning to skip over the instruction that caused the exception. The
    <code>mfc0</code> and <code>mtc0</code> instructions are used to read from and write to
    Coprocessor 0 registers.
  </li>
  <li>
    Bits 8-15 of the Cause register $13 can also be used to indicate pending interrupts. In Java
    MARS this is used by the Keyboard and Display Simulator Tool (not yet available in MARS-ts),
    where bit 8 represents a keyboard interrupt and bit 9 represents a display interrupt. For more
    details, see the Help panel for that Tool.
  </li>
  <li>
    Exception types declared in <code>mars.simulator.Exceptions</code>, but not necessarily
    implemented, are ADDRESS_EXCEPTION_LOAD (4), ADDRESS_EXCEPTION_STORE (5), SYSCALL_EXCEPTION (8),
    BREAKPOINT_EXCEPTION (9), RESERVED_INSTRUCTION_EXCEPTION (10), ARITHMETIC_OVERFLOW_EXCEPTION
    (12), TRAP_EXCEPTION(13), DIVIDE_BY_ZERO_EXCEPTION (15), FLOATING_POINT_OVERFLOW (16), and
    FLOATING_POINT_UNDERFLOW (17).
  </li>
  <li>
    When writing a non-trivial exception handler, your handler must first save general purpose
    register contents, then restore them before returning.
  </li>
</ul>

<h3>Example of Trap Handler</h3>
The sample MIPS program below will immediately generate a trap exception because the trap condition
evaluates true, control jumps to the exception handler, the exception handler returns control to the
instruction following the one that triggered the exception, then the program terminates normally.
<pre>
   .text
main:
   teqi $t0,0     # immediately trap because $t0 contains 0
   li   $v0, 10   # After return from exception handler, specify exit service
   syscall        # terminate normally

# Trap handler in the standard MIPS32 kernel text segment

   .ktext 0x80000180
   move $k0,$v0   # Save $v0 value
   move $k1,$a0   # Save $a0 value
   la   $a0, msg  # address of string to print
   li   $v0, 4    # Print String service
   syscall
   move $v0,$k0   # Restore $v0
   move $a0,$k1   # Restore $a0
   mfc0 $k0,$14   # Coprocessor 0 register $14 has address of trapping instruction
   addi $k0,$k0,4 # Add 4 to point to next instruction
   mtc0 $k0,$14   # Store new address back into $14
   eret           # Error return; set PC to value in $14
   .kdata
msg:
   .asciiz "Trap generated"
</pre>

<h3>Widely Used Exception Handler</h3>
<p>
  Settings → Exception Handler ... offers <strong>Use SPIM default exceptions handler</strong>. This
  bundled source includes startup code that calls a user-defined global <code>main</code> label and
  assumes the default memory configuration. Its original <code>.set</code> directives produce MARS
  warnings; leave “Assembler warnings are considered errors” off to assemble it.
</p>
<p>
  Open default <code><strong>exceptions.s</strong></code> in editor closes the dialog without
  applying draft settings and opens a locked, read-only reference. You can select, copy, and search
  its text. Copy to new file creates an editable source containing the full text and James R.
  Larus’s BSD license notice, which must be retained in copies. Save the modified copy and choose it
  with Browse to use a customized handler. The original remains read-only after reload. The
  Exceptions toolbar button opens the same dialog; Memory Configuration is immediately after the
  ASCII display toggle.
</p>

<header>
  <h3>Writing and Using Macros</h3>
  <h4>
    <code>.macro</code>, <code>.end_macro</code>,<code>.eqv</code> and
    <code>.include</code> directives are new in MARS 4.3
  </h4>
</header>
<h3>Introduction to macros</h3>
<p>
  Patterson and Hennessy define a <b>macro</b> as
  <i
    >a pattern-matching and replacement facility that provides a simple mechanism to name a
    frequently used sequence of instructions</i
  >
  [1]. This permits the programmer to specify the instruction sequence by invoking the macro. This
  requires only one line of code for each use instead of repeatedly typing in the instruction
  sequence each time. It follows the axiom "define once, use many times," which not only reduces the
  chance for error but also facilitates program maintenance.
</p>

<p>
  Macros are like procedures (subroutines) in this sense but operate differently than procedures.
  Procedures in MIPS assembly language follow particular protocols for procedure definition, call
  and return. Macros operate by substituting the macro body for each use at the time of assembly.
  This substitution is called <i>macro expansion.</i>. They do not require the protocols and
  execution overhead of procedures.
</p>

<p>
  As a simple example, you may want to terminate your program from a number of locations. If you are
  running from the MARS IDE, you will use system call 10, <code>exit</code>. The instruction
  sequence is pretty easy
</p>
<pre>
        li $v0,10
        syscall
</pre>
but still tedious. You can define a macro, let's call it <code>done</code>, to represent this
sequence
<pre>
        .macro done
        li $v0,10
        syscall
        .end_macro
</pre>
then invoke it whenever you wish with the statement
<pre>
          done
</pre>
At assembly time, the assembler will replace each occurrence of the statement <code>done</code> with
the two-statement sequence
<pre>
        li $v0,10
        syscall
</pre>
This is the macro expansion. The runtime simulator is unaware of macros or macro expansion.

<p>
  Legacy command-line example: Java MARS can return a termination value. MARS-ts has no command-line
  launcher, and its GUI ignores the exit2 termination value. This can be done with syscall 17,
  <code>exit2</code>, which takes the termination value as an argument. An equivalent macro, let's
  call it <code>terminate</code> would be
</p>
<pre>
        .macro terminate (%termination_value)
        li $a0, %termination_value
        li $v0, 17
        syscall
        .end_macro
</pre>
This macro defines a <i>formal parameter</i> to represent the termination value. You would invoke it
with the statement
<pre>
        terminate (1)
</pre>
to terminate with value 1. Upon assembly, the statement <code>terminate (1)</code> would be replaced
by the three-statement sequence
<pre>
        li $a0, 1
        li $v0, 17
        syscall
</pre>
The <i>argument value</i>, 1, is substituted wherever the formal parameter
<code>%termination_value</code> appears in the macro body. This is a textual substitution. Note that
in this example the argument value must be an integer, not a register name or a label, because the
parameter is used as the second operand in the Load Immediate operation.

<p>
  In MARS, a macro is similar to an extended (pseudo) instruction. They are distinguished in that
  the expansion of extended instructions is supported by an internally-defined specification
  language and mechanism which can manipulate argument values. The macro facility can only
  substitute argument values as given, and it uses a separate mechanism from extended instructions.
</p>

<p>Additional examples and details follow.</p>

<h3>How to define macros</h3>
The first line begins with a <code>.macro</code> directive, the macro name, and an optional list of
formal parameters. Placing commas between parameters and parentheses around the list is optional.
<p>
  Each formal parameter is an identifier that begins with a <code>%</code> character. For
  compatibility with the SPIM preprocessor APP, it may alternatively begin with <code>$</code>.
</p>
<p>
  The lines that follow define the body of the macro. Use the formal parameters as appropriate. The
  body may contain data segments as well as text segments.
</p>
<p>The macro definition finishes with a <code>.end_macro</code> directive.</p>
<p>See the Notes below for additional information.</p>

<h3>How to use macros</h3>

To invoke a macro, form a statement consisting of the macro name and then one token for each
argument to be substituted for its corresponding formal parameter by the assembler. The argument
list may optionally be surrounded by parentheses. Arguments may be separated either by spaces or
commas.
<p>Macro expansion is a pre-processing task for assemblers.</p>
<h3>Notes</h3>
<ul>
  <li>A macro definition must appear before its use. No forward references.</li>
  <li>All macro definitions are local in each file and they cannot be global.</li>
  <li>
    Nested macro definitions are not supported. No <code>.macro</code> directive should appear
    inside body of a macro definition.
  </li>
  <li>
    A macro definition can contain a call to a previously-defined macro. Only backward references
    are allowed.
  </li>
  <li>
    Labels placed in the body of a macro definition will not have same name after macro expansion.
    During expansion, their name will be followed by "_M#" where # will be a unique number for each
    macro expansion.
  </li>
  <li>
    Two macros with the same name but different number of parameters are considered different and
    both can be used.
  </li>
  <li>
    A macro defined with the same name and same number of parameters as another macro defined before
    it will be ignored.
  </li>
  <li>
    Each argument in a macro call can only be a single language element (token). For instance
    "4($t0)" cannot be an argument.
  </li>
  <li>
    Macros are a part of the assembler, not the ISA. So the syntax might be different with other
    assemblers. For compatibility with the SPIM simulator,
    <i>SPIM-style macros are also supported in MARS</i>. SPIM-style macros are same as MARS but
    formal parameters begin with "$" instead of "%".
  </li>
</ul>
<h3>Examples</h3>
<p>Printing an integer (argument may be either an immediate value or register name):</p>
<pre>
    .macro print_int (%x)
    li $v0, 1
    add $a0, $zero, %x
    syscall
    .end_macro

    print_int ($s0)
    print_int (10)
</pre>
<p>
  Printing a string (macro will first assign a label to its parameter in data segment then print
  it):
</p>
<pre>
    .macro print_str (%str)
    .data
myLabel: .asciiz %str
    .text
    li $v0, 4
    la $a0, myLabel
    syscall
    .end_macro

    print_str ("test1") #"test1" will be labeled with name "myLabel_M0"
    print_str ("test2") #"test2" will be labeled with name "myLabel_M1"
</pre>
<p>Implementing a simple for-loop:</p>
<pre>
    # generic looping mechanism
    .macro for (%regIterator, %from, %to, %bodyMacroName)
    add %regIterator, $zero, %from
    Loop:
    %bodyMacroName ()
    add %regIterator, %regIterator, 1
    ble %regIterator, %to, Loop
    .end_macro

    #print an integer
    .macro body()
    print_int $t0
    print_str "\\n"
    .end_macro

    #printing 1 to 10:
    for ($t0, 1, 10, body)
</pre>
<p>
  The <code>for</code> macro has 4 parameters. <code>%regIterator</code> should be the name of a
  register which iterates from <code>%from</code> to <code>%to</code> and in each iteration
  <code>%bodyMacroName</code> will be expanded and run. Arguments for <code>%from</code> and
  <code>%to</code> can be either a register name or an immediate value, and
  <code>%bodyMacroName</code> should be name of a macro that has no parameters.
</p>
<h3>Macro source line numbers</h3>
<p>
  For purpose of error messaging and Text Segment display, MARS attempts to display line numbers for
  both the definition and use of the pertinent macro statement. If an error message shows the line
  number in the form "<code>X-&gt;Y</code>" (e.g. "<code>20-&gt;4</code>"), then <code>X</code> is
  the line number in the expansion (use) where the error was detected and <code>Y</code> is the line
  number in the macro definition. In the Text Segment display of source code, the macro definition
  line number will be displayed within brackets, e.g. "<code>&lt;4&gt;</code>", at the point of
  expansion. Line numbers should correspond to the numbers you would see in the text editor.
</p>

<h3>The .eqv directive</h3>
<p>
  The <code>.eqv</code> directive (short for "equivalence") is also new in MARS 4.3. It is similar
  to <code>#define</code> in C or C++. It is used to substitute an arbitrary string for an
  identifier. It is useful but much less powerful than macros. It was developed independently of the
  macro facility.
</p>
<p>
  Using <code>.eqv</code>, you can specify simple substitutions that provide "define once, use many
  times" capability at assembly pre-processing time. For example, once you define
</p>
<pre>
       .eqv  LIMIT      20
       .eqv  CTR        $t2
       .eqv  CLEAR_CTR  add  CTR, $zero, 0
</pre>
then you can refer to them in subsequent code:
<pre>
       li $v0,1
       CLEAR_CTR
loop:  move $a0, CTR
       syscall
       add   CTR, CTR, 1
       blt   CTR, LIMIT, loop
       CLEAR_CTR
</pre>
During assembly pre-processing, the <code>.eqv</code> substitutions will be applied. The resulting
code is
<pre>
       li   $v0,1
       add  $t2, $zero, 0
loop:  move $a0, $t2
       syscall
       add  $t2, $t2, 1
       blt  $t2, 20, loop
       add  $t2, $zero, 0
</pre>
which when run will display the values 0 through 19 on one line with no intervening spaces.

<p>
  Note that the substitution string is not limited to a single token. Like <code>.macro</code>,
  <code>.eqv</code> is local to the file in which it is defined, and must be defined prior to use.
  Macro bodies can contain references to <code>.eqv</code> directives.
</p>

<h3>The .include directive</h3>
<p class="notice">
  In MARS-ts, include filenames resolve relative to the including source in the browser source
  library. Open buffers take precedence over saved library sources. Import or save the included file
  before assembling; this does not read arbitrary files from your computer or the network.
</p>
<p>
  The <code>.include</code> directive is also new in MARS 4.3. It has one operand, a quoted
  filename. When the directive is carried out, the contents of the specified file are substituted
  for the directive. This occurs during assembly preprocessing. It is like <code>#include</code> in
  C or C++.
</p>

<p>
  <code>.include</code> is designed to make macro and equivalence (.eqv directive) use more
  convenient. Both macro definitions and equivalence definitions are <i>local</i>, which means they
  can be used only in the same file where defined. Without <code>.include</code>, you would have to
  repeat their definitions in every file where you want to use them. Besides being tedious, this is
  poor programming practice; remember "define once, use many times." Now you can define macros and
  equivalences in a separate file, then include it in any file where you want to use them.
</p>

<p>
  The <code>.include</code> preprocessor will detect and flag any circular includes (file that
  includes itself, directly or indirectly).
</p>
<p>
  The use of <code>.include</code> presents some challenges for error messaging and for source code
  numbering in the Text Segment display. If a file being included has any assembly errors, the
  filename and line number in the error message should refer to the file being included, not the
  file it was substituted into. Similarly, the line number given in the Text Segment source code
  display refers to the line in the file being included. Thus the displayed line numbers do not
  monotonically increase. Java MARS’s legacy "assemble all" setting also had this effect; the
  browser assembles the active source and its explicit includes. Line numbers should correspond to
  the numbers you would see in the text editor.
</p>

<p>
  As a simple example, you could define the <code>done</code> macro (and others) in a separate file
  then include it wherever you need it. Suppose "macros.asm" contains the following:
</p>
<pre>
        .macro done
        li $v0,10
        syscall
        .end_macro
</pre>

You could then include it in a different source file something like this:
<pre>
        .include "macros.asm"
        .data
value:      .word    13
        .text
        li   $v0, 1
        lw   $a0, value
        syscall
        done
</pre>
<p>During assembly preprocessing, this would be expanded to</p>
<pre>
        .macro done
        li $v0,10
        syscall
        .end_macro
        .data
value:      .word    13
        .text
        li   $v0, 1
        lw   $a0, value
        syscall
        done
</pre>
<p>The assembler will then perform the appropriate macro expansion.</p>
<h3>Acknowledgements</h3>
<p>
  The MARS macro facility was developed in 2012 by Mohammad Hossein Sekhavat, sekhavat17@gmail.com,
  while an engineering student at Sharif University in Tehran. MARS creators Pete and Ken are
  incredibly grateful for his contribution! Pete developed <code>.eqv</code> and
  <code>.include</code> at about the same time.
</p>

  Patterson and Hennessy, Morgan Kauffman Publishers, 2009.
</p>

<header>
  <h3>MARS - Mips Assembly and Runtime Simulator</h3>
  <h4>Release 4.5</h4>
  <h4>August 2014</h4>
  <h4>Cool Capability: Plug-in Tools</h4>
</header>

Beginning with Release 2.0, MARS is capable of running externally-developed software that interacts
with an executing MIPS program and MIPS system resources. The requirements for such a program are:
<ol>
  <li>It implements the <code>mars.tools.MarsTool</code> interface.</li>
  <li>It is part of the <code>mars.tools</code> package.</li>
  <li>
    It compiles cleanly into a ".class" file, stored in the <code>mars/tools</code> directory.
  </li>
</ol>
MARS will detect all qualifying tools upon startup and include them in its Tools menu. When a tool's
menu item is selected, an instance of it will be created using its no-argument constructor and its
<code>action()</code> method will be invoked. If no qualifying tools are found at MARS startup, the
Tools menu will not appear.

<p>
  To use such a tool, load and assemble a MIPS program of interest then select the desired tool from
  the Tools menu. The tool's window will open and depending on how it is written it will either need
  to be "connected" to the MIPS program by clicking a button or will already be connected. Run the
  MIPS program as you normally would, to initiate tool interaction with the executing program.
</p>
<p>
  Beginning with Release 3.2, the abstract class
  <code>mars.tools.AbstractMarsToolAndApplication</code>
  is included in the MARS distribution to provide a substantial framework for implementing your own
  MARS Tool. A subclass that extends it by implementing at least its two abstract methods can be run
  not only from the Tools menu but also as a free-standing application that uses the MARS assembler
  and simulator in the background.
</p>
<p>
  Several Tools developed by subclassing <code>AbstractMarsToolAndApplication</code> are included
  with MARS: an Introduction to Tools, a Data Cache Simulator, a Memory Reference Visualizer, and a
  Floating Point tool. The last one is quite useful even when not connected to a MIPS program
  because it displays binary, hexadecimal and decimal representations for a 32 bit floating point
  value; when any of them is modified the other two are updated as well.
</p>
<p>
  Release 3.5 includes new tools, most notably a keyboard and display simulator that allows you to
  perform memory-mapped I/O (MMIO) using polled and interrupt-driven techniques as described in
  various references. Click its Help button for more details.
</p>
<p>
  If you wish to develop your own MARS Tool, you will first need to extract the MARS distribution
  from its JAR file if you have not already done so. All MARS tools must be stored in the
  <code>mars/tools</code> directory.
</p>
<p>
  Follow the Tutorial Materials link on the MARS homepage to find a tutorial that covers development
  of MARS Tools.
</p>
<h4>Cool Capability: Extending the syscall set or reassigning syscall numbers</h4>

Beginning with Release 3.1, system calls (<code>syscall</code> instruction) are implemented using a
technique similar to that for tools. This permits anyone to add a new syscall by defining a new
class that meets these requirements:
<ol>
  <li>
    It implements the <code>mars.mips.instructions.syscalls.Syscall</code> interface, or extends the
    <code>mars.mips.instructions.syscalls.AbstractSyscall</code> class (which provides default
    implementations of everything except the <code>simulate()</code> method).
  </li>
  <li>It is part of the <code>mars.mips.instructions.syscalls</code> package.</li>
  <li>
    It compiles cleanly into a ".class" file, stored in the
    <code>mars/mips/instructions/syscalls</code> directory.
  </li>
</ol>
MARS will detect all qualifying syscall classes upon startup and the runtime simulator will invoke
them when the <code>syscall</code> instruction is simulated and register <code>$v0</code>
contains the corresponding integer service number.

<p>
  Syscalls and syscall number assignments in MARs match those of SPIM for syscalls 1 through 17.
  However if you wish to change syscall number assignments, you may do so by editing the
  <code>Syscall.properties</code> file included in the release (this requires extraction from the
  JAR file).
</p>
<p>
  Follow the Tutorial Materials link on the MARS homepage to find a tutorial that covers development
  of system calls.
</p>
<h4>Cool Capability: Extending the instruction set</h4>

You can add customized pseudo-instructions to the MIPS instruction set by editing the
<code>PseudoOps.txt</code> file included in the MARS distribution. Instruction specification formats
are explained in the file itself. The specification of a pseudo-instruction is one line long. It
consists of an example of the instruction, constructed using available instruction specification
symbols, followed by a tab-separated list of the basic MIPS instructions it will expand to. Each is
an instruction template constructed using instruction specification symbols combined with special
template specification symbols. The latter permit substitution at program assembly time of operands
from the user's program into the expanded pseudo-instruction.

<p>
  <code>PseudoOps.txt</code> is read and processed at MARS startup, and error messages will be
  produced if a specification is not correctly formatted. Note that if you wish to edit it you first
  have to extract it from the JAR file.
</p>
<p>
  Follow the Tutorial Materials link on the MARS homepage to find a tutorial that covers
  modification of the pseudo-instruction set.
</p>

<header>
  <h3>Operating Requirements and Limitations</h3>
  <p>Original article: Release 4.5 · August 2014</p>
</header>
<h3>Browser requirements</h3>
<p>
  MARS-ts runs its TypeScript assembler and simulator in a modern browser with JavaScript enabled.
  No Java runtime, Swing installation, or JAR is required. Browser storage retains sources, recovery
  text, and preferences when available. Desktop presentation and undo recovery are saved in short
  batches and flushed when leaving the page; an abrupt browser failure can lose a pending batch.
  Source drafts are backed up after each edit. Storage failures are reported; export files for
  copies outside the browser.
</p>
<h3>Current limits</h3>
<ul>
  <li>
    The default layout retains the legacy memory-segment limits: text, data, stack, kernel text, and
    kernel data each have a maximum 4 MB backing range from their respective bases. Memory is
    allocated sparsely as used.
  </li>
  <li>There is no pipelined mode. Delayed branching is supported.</li>
  <li>
    The desktop uses the MARS assembler and simulator; it is not a front end for other compilers or
    simulators.
  </li>
  <li>
    Open and Save operate on the browser source library. Import File(s) and Export File move .asm
    and .s files between the library and your computer; Import File(s) also reads ZIP archives of
    them, keeping their folder paths, and lists any skipped files before you confirm. Includes use
    virtual source paths, not arbitrary OS paths; assembly starts with the active source and follows
    its explicit includes. Other open tabs are not automatically assembled.
  </li>
  <li>
    MARS data stays in this browser. Export MARS and Import MARS move all of it as one
    mars-ts-data.json file; importing replaces the data already in the browser rather than merging
    with it, and only files written by Export MARS in the current format are accepted.
  </li>
  <li>
    File, time, and sleep syscalls remain unfinished. Random 40–44 and dialog 50–59 services are
    available. MIDI 31 and 33 play sine tones that ignore the instrument number and sound only after
    Go or Step starts the program. See Syscalls for exact service availability. Tools are disabled.
    File → Dump Memory exports populated text or data memory in all six legacy formats.
  </li>
  <li>
    The Exception Handler dialog selects a default or saved-library handler for automatic inclusion;
    explicit handler code is also supported. Memory Configuration supports the default layout and
    both compact layouts.
  </li>
  <li>
    Editor and highlighting customization use bundled presets, not the original dialogs.
    Command-line operation is excluded. Program arguments are available through Settings and the
    Args toolbar toggle; their text follows legacy whitespace splitting and low-byte character
    storage.
  </li>
  <li>
    Backstep history is bounded to 2000 recent steps and does not reverse output or external I/O.
    Stable machine state and Backstep history are recovered after reload; active execution is not
    resumed. Numeric register and memory edits require execution to be stopped; condition flags
    remain editable during execution.
  </li>
  <li>
    Execution yields cooperatively to the browser. Limited-speed timing is approximate, and large
    workloads still consume browser CPU and memory.
  </li>
</ul>
<h3>Branch offsets</h3>
<p>
  The original guide documents a change in Java Release 3.4: a branch encodes the relative number of
  words from the next instruction, whether delayed branching is enabled or disabled. Thus
  <code>label: beq $0,$0,label</code> encodes as <code>0x1000FFFF</code> in both modes. Earlier
  releases encoded <code>0x10000000</code> when delayed branching was disabled. The simulator
  accounts for the selected branch mode.
</p>
<h3>Historical Java limitations</h3>
<p>
  The Release 4.5 article described a Java/Swing application requiring J2SE Release 1.5, tested on
  Windows XP, Vista and 7 and Mac OS X, and also used on Linux. Its JFileChooser did not follow
  links or shortcuts. It noted limited preference persistence, an assembly-error highlighter that
  could miss a source not already open, a Screen Magnifier capture issue on Windows Vista, and
  reported editor slowdown during long sessions that disappeared after restarting. These are
  retained as historical observations, not claims about the browser implementation.
</p>
<p>
  The original instruction-set reference was
  <cite>Computer Organization and Design, Fourth Edition</cite>, Patterson and Hennessy, Elsevier –
  Morgan Kaufmann, 2009. Browser feature availability is described above rather than inferred from
  the original article’s Appendix B coverage claim.
</p>
