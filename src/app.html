<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <script>
      // Apply the saved palette before the stylesheet and desktop can paint.
      // The key matches THEME_STORAGE_KEY in src/lib/browser/ThemePreference.ts.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('mars-ts:theme:v1') === 'dark' ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
